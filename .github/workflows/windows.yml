name: AURA Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "aura-core/**"
      - "aura-desktop/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/windows.yml"

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Test AURA Core
        shell: pwsh
        run: gradle :aura-core:test --no-daemon
      - name: Build Windows distribution
        shell: pwsh
        run: gradle :aura-desktop:installDist --no-daemon
      - name: Package Windows app image
        shell: pwsh
        run: jpackage --type app-image --name AURA --input aura-desktop/build/install/aura-desktop/lib --main-jar aura-desktop.jar --main-class com.aura.desktop.AuraDesktopKt --dest aura-desktop/build/jpackage
      - name: Zip Windows app
        shell: pwsh
        run: Compress-Archive -Path aura-desktop/build/jpackage/AURA -DestinationPath aura-desktop/build/AURA-Windows.zip
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: aura-windows
          path: aura-desktop/build/AURA-Windows.zip
          if-no-files-found: error
